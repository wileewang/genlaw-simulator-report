<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="case-title case-desc">
<title id="case-title">S1 偏心通孔薄板，单位毫米</title>
<desc id="case-desc">俯视外形为 8 乘 6 的矩形，直径 2 的孔位于 X 为 3、Y 为 2 的位置。右侧剖面显示板厚 1.5，孔上下贯通。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#687d82"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#b5cbc6" stroke-width="1"/></pattern></defs>
<style>text{font:17px system-ui,sans-serif;fill:#193d46}.dim{stroke:#687d82;stroke-width:1;fill:none}.measure{stroke:#687d82;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}.body{fill:#dceae5;stroke:#275951;stroke-width:2}.center{stroke:#668e85;stroke-width:1;stroke-dasharray:7 4}.caption{font-size:15px;fill:#536c72}.strong{font-weight:650}</style>
<rect width="920" height="440" fill="white"/><text x="150" y="25" class="strong">俯视 · 孔位不居中</text><text x="600" y="65" class="strong">过孔心剖面 · 上下贯通</text>
<rect class="body" x="150" y="90" width="320" height="240" rx="1"/>
<circle cx="270" cy="250" r="40" fill="white" stroke="#275951" stroke-width="2"/>
<path class="center" d="M150 250H470M270 90V330"/>
<path class="dim" d="M150 90V55M470 90V55M150 90H100M150 330H100"/>
<path class="measure" d="M150 65H470M110 90V330"/>
<text x="306" y="56">8</text><text x="88" y="215">6</text>
<path class="dim" d="M150 330V382M270 330V382M470 250H520M470 330H520"/>
<path class="measure" d="M150 370H270M506 250V330"/>
<text x="190" y="395">X = 3</text><text x="521" y="296">Y = 2</text>
<path class="dim" d="M299 221L352 169H435"/><text x="352" y="158">φ2 通孔</text>
<circle cx="150" cy="330" r="4" fill="#193d46"/><text x="133" y="353">O</text>
<path d="M150 330H193M150 330V287" stroke="#193d46" fill="none"/><text x="201" y="349" class="caption">X</text><text x="129" y="285" class="caption">Y</text>
<path class="body" d="M600 155H660V200H600ZM720 155H840V200H720Z"/>
<path d="M600 155H660V200H600ZM720 155H840V200H720Z" fill="url(#hatch)"/>
<path class="center" d="M690 133V223"/>
<path class="dim" d="M660 155V115M720 155V115M840 155H880M840 200H880"/>
<path class="measure" d="M660 125H720M870 155V200"/>
<text x="680" y="111">φ2</text><text x="880" y="184">1.5</text>
<path class="dim" d="M600 200V248M840 200V248"/><path class="measure" d="M600 238H840"/><text x="716" y="263">8</text>
<text x="600" y="305" class="caption">一块毛坯 · 一把钻头 · 一次装夹</text><text x="600" y="331" class="caption">刀轴沿 Z；从顶面向下钻孔</text>
<text x="150" y="425" class="caption">原点在毛坯顶面角点；Z 向上，毛坯底面 Z = −1.5。单位：mm。</text>
</svg>