<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="940" viewBox="0 0 1620 940" role="img" aria-labelledby="title desc"><title id="title">制造自动化系统架构与数据流</title><desc id="desc">上游模型绑定几何与制造要求。我们的系统包括工艺 Agent、工艺卡校验、CAM 适配器、仿真适配器、几何验收与报告。CAM 适配器调用 FreeCAD CAM 和设备后处理；仿真适配器调用 CAMotics 等独立引擎。原始验收基准只读，失败证据返回工艺 Agent。资源库、规划和适配接口待补，基础去料和几何比对可复用。此图为设计方案。</desc><defs><marker id="forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#193d46"/></marker><marker id="read" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#3977aa"/></marker><marker id="feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#ad6835"/></marker></defs><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei','Droid Sans Fallback',sans-serif"><rect x="0" y="0" width="1620" height="940" rx="0" fill="#f8fafb" stroke="none" stroke-width="1.5"/><text x="40" y="56" font-size="31" fill="#193d46" text-anchor="start" font-weight="700">制造自动化 · 系统架构</text><text x="1578" y="51" font-size="16" fill="#617782" text-anchor="end" font-weight="400">设计方案 · 尚未整链接通</text><rect x="310" y="260" width="1260" height="402" rx="20" fill="#eef6f4" stroke="#c7dcd7" stroke-width="1.5"/><text x="332" y="294" font-size="18" fill="#087d79" text-anchor="start" font-weight="600">我们开发 / 集成</text><text x="40" y="294" font-size="18" fill="#7756a7" text-anchor="start" font-weight="600">上游提供</text><rect x="330" y="104" width="880" height="94" rx="12" fill="#eef3fa" stroke="#cfdae9" stroke-width="1.5"/><text x="354" y="140" font-size="22" fill="#3977aa" text-anchor="start" font-weight="600">制造资源与作业配置</text><text x="354" y="174" font-size="18" fill="#617782" text-anchor="start" font-weight="400">原料 / 实际来料 · 设备 / 控制器 · 刀具 · 夹具 · 工艺规则</text><rect x="1085" y="118" width="100" height="27" rx="13" fill="#fff2e5" stroke="none" stroke-width="1.5"/><text x="1135" y="137" font-size="13" fill="#ad6835" text-anchor="middle" font-weight="600">待补齐</text><path d="M540 198V335" fill="none" stroke="#3977aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#read)"/><path d="M860 198V335" fill="none" stroke="#3977aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#read)"/><path d="M1180 198V335" fill="none" stroke="#3977aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#read)"/><rect x="1290" y="104" width="240" height="94" rx="12" fill="#eef3fa" stroke="#cfdae9" stroke-width="1.5"/><text x="1410" y="140" font-size="21" fill="#3977aa" text-anchor="middle" font-weight="600">原始验收基准</text><text x="1410" y="173" font-size="17" fill="#617782" text-anchor="middle" font-weight="400">原始 CAD + 绑定要求</text><path d="M1410 198V335" fill="none" stroke="#3977aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#read)"/><rect x="1357" y="233" width="106" height="27" rx="13" fill="#e4edf9" stroke="none" stroke-width="1.5"/><text x="1410" y="252" font-size="13" fill="#3977aa" text-anchor="middle" font-weight="600">只读对照</text><rect x="40" y="340" width="220" height="168" rx="12" fill="#f5f0fa" stroke="#d6c9e4" stroke-width="1.5"/><text x="60" y="371" font-size="15" fill="#7756a7" text-anchor="start" font-weight="600">模型 + 程序校验</text><text x="60" y="411" font-size="23" fill="#193d46" text-anchor="start" font-weight="600">特征与要求绑定</text><text x="60" y="442" font-size="16" fill="#617782" text-anchor="start" font-weight="400">CadQuery + 制造要求</text><rect x="60" y="463" width="124" height="27" rx="13" fill="#fff2e5" stroke="none" stroke-width="1.5"/><text x="122" y="482" font-size="13" fill="#ad6835" text-anchor="middle" font-weight="600">待上游补齐</text><rect x="330" y="340" width="240" height="168" rx="12" fill