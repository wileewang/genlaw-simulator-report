<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc"><title id="title">制造系统模块的输入、实现方式与输出</title><desc id="desc">十个主步骤和三个支撑模块，每行依次列出模块、实现者、输入、内部处理和输出。CAM 任务转换、FreeCAD 刀路计算、设备后处理分别列出，避免混淆 CAM Job、刀路和 G-code。接口为拟定设计，并非已实现的自动制造链。</desc><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei','Droid Sans Fallback',sans-serif"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#f7fafb" stroke="none"/><text x="28" y="43" font-size="30" fill="#193d46" font-weight="700">模块定义：输入 → 实现 → 输出</text><rect x="1015" y="29" width="10" height="10" rx="2" fill="#7756a7" stroke="none"/><text x="1034" y="41" font-size="15" fill="#617782" font-weight="400">模型 / Agent</text><rect x="1210" y="29" width="10" height="10" rx="2" fill="#087d79" stroke="none"/><text x="1229" y="41" font-size="15" fill="#617782" font-weight="400">我们的程序</text><rect x="1400" y="29" width="10" height="10" rx="2" fill="#3977aa" stroke="none"/><text x="1419" y="41" font-size="15" fill="#617782" font-weight="400">现成软件</text><text x="32" y="86" font-size="18" fill="#617782" font-weight="600">模块 / 实现者</text><text x="278" y="86" font-size="18" fill="#617782" font-weight="600">输入</text><text x="651" y="86" font-size="18" fill="#617782" font-weight="600">内部怎么做</text><text x="1131" y="86" font-size="18" fill="#617782" font-weight="600">输出</text><rect x="20" y="108" width="1560" height="76" rx="0" fill="#fff" stroke="none"/><rect x="20" y="108" width="4" height="76" rx="0" fill="#7756a7" stroke="none"/><text x="36" y="131" font-size="20" fill="#193d46" font-weight="600">01  几何与要求绑定</text><text x="36" y="152" font-size="13" fill="#7756a7" font-weight="500">上游模型 + 校验程序</text><text x="36" y="172" font-size="12" fill="#617782" font-weight="400">待上游补齐</text><text x="278" y="138" font-size="16" fill="#193d46" font-weight="400">D0：CadQuery / CAD + 制造要求</text><text x="278" y="162" font-size="16" fill="#617782" font-weight="400">孔、面、基准及公差 / 粗糙度标注</text><text x="651" y="138" font-size="16" fill="#193d46" font-weight="400">模型判断每条要求对应哪个特征</text><text x="651" y="162" font-size="16" fill="#617782" font-weight="400">程序校验引用、模型版本和单位</text><text x="1131" y="138" font-size="16" fill="#193d46" font-weight="600">D1：零件输入包</text><text x="1131" y="162" font-size="16" fill="#617782" font-weight="400">CAD + 特征 ID + 已绑定的要求</text><path d="M257 118V174" stroke="#dce5e8" stroke-width="1"/><path d="M630 118V174" stroke="#dce5e8" stroke-width="1"/><path d="M1110 118V174" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="186" width="1560" height="76" rx="0" fill="#f0f5f7" stroke="none"/><rect x="20" y="186" width="4" height="76" rx="0" fill="#7756a7" stroke="none"/><text x="36" y="209" font-size="20" fill="#193d46" font-weight="600">02  工艺规划 Agent</text><text x="36" y="230" font-size="13" fill="#7756a7" font-weight="500">模型 / Agent</text><text x="36" y="250" font-size="12" fill="#617782" font-weight="400">待开发</text><text x="278" y="216" font-size="16" fill="#193d46" font-weight="400">D1：零件输入包 + R：资源档案</text><text x="278" y="240" font-size="16" fill="#617782" font-weight="400">可用原料、设备、刀具和夹具</text><text x="651" y="216" font-size="16" fill="#193d46" font-weight="400">选择毛坯、装夹、工序顺序</text><text x="651" y="240" font-size="16" fill="#617782" font-weight="400">选择刀具、余量、进给和转速</text><text x="1131" y="216" font-size="16" fill="#193d46" font-weight="600">D2：工艺卡 JSON</text><text x="1131" y="240" font-size="16" fill="#617782" font-weight="400">有序工序及各工序的资源和参数</text><path d="M257 196V252" stroke="#dce5e8" stroke-width="1"/><path d="M630 196V252" stroke="#dce5e8" stroke-width="1"/><path d="M1110 196V252" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="264" width="1560" height="76" rx="0" fill="#fff" stroke="none"/><rect x="20" y="264" width="4" height="76" rx="0" fill="#087d79" stroke="none"/><text x="36" y="287" font-size="20" fill="#193d46" font-weight="600">03  工艺卡校验</text><text x="36" y="308" font-size="13" fill="#087d79" font-weight="500">我们写的规则程序</text><text x="36" y="328" font-size="12" fill="#617782" font-weight="400">有局部规则，需统一</text><text x="278" y="294" font-size="16" fill="#193d46" font-weight="400">D2：工艺卡 + D1：原始要求</text><text x="278" y="318" font-size="16" fill="#617782" font-weight="400">R：设备、刀具、夹具及能力约束</text><text x="651" y="294" font-size="16" fill="#193d46" font-weight="400">检查字段、引用、单位与参数范围</text><text x="651" y="318" font-size="16" fill="#617782" font-weight="400">检查选定设备是否支持这些工序</text><text x="1131" y="294" font-size="16" fill="#193d46" font-weight="600">D3：已校验工艺卡</text><text x="1131" y="318" font-size="16" fill="#617782" font-weight="400">或：错误清单 → 工艺 Agent</text><path d="M257 274V330" stroke="#dce5e8" stroke-width="1"/><path d="M630 274V330" stroke="#dce5e8" stroke-width="1"/><path d="M1110 274V330" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="342" width="1560" height="76" rx="0" fill="#f0f5f7" stroke="none"/><rect x="20" y="342" width="4" height="76" rx="0" fill="#087d79" stroke="none"/><text x="36" y="365" font-size="20" fill="#193d46" font-weight="600">04  CAM 任务转换</text><text x="36" y="386" font-size="13" fill="#087d79" font-weight="500">我们写的 Python 程序</text><text x="36" y="406" font-size="12" fill="#617782" font-weight="400">待开发 / 接入</text><text x="278" y="372" font-size="16" fill="#193d46" font-weight="400">D3：已校验工艺卡 + 原始 CAD</text><text x="278" y="396" font-size="16" fill="#617782" font-weight="400">R：刀具、设备及装夹参数</text><text x="651" y="372" font-size="16" fill="#193d46" font-weight="400">把工序映射成 FreeCAD 操作对象</text><text x="651" y="396" font-size="16" fill="#617782" font-weight="400">创建 Job、工具与坐标设置</text><text x="1131" y="372" font-size="16" fill="#193d46" font-weight="600">D4：FreeCAD CAM Job</text><text x="1131" y="396" font-size="16" fill="#617782" font-weight="400">模型、毛坯、工具、操作的任务对象</text><path d="M257 352V408" stroke="#dce5e8" stroke-width="1"/><path d="M630 352V408" stroke="#dce5e8" stroke-width="1"/><path d="M1110 352V408" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="420" width="1560" height="76" rx="0" fill="#fff" stroke="none"/><rect x="20" y="420" width="4" height="76" rx="0" fill="#3977aa" stroke="none"/><text x="36" y="443" font-size="20" fill="#193d46" font-weight="600">05  刀路计算</text><text x="36" y="464" font-size="13" fill="#3977aa" font-weight="500">现成软件：FreeCAD CAM</text><text x="36" y="484" font-size="12" fill="#617782" font-weight="400">软件现成，待集成</text><text x="278" y="450" font-size="16" fill="#193d46" font-weight="400">D4：CAM Job</text><text x="278" y="474" font-size="16" fill="#617782" font-weight="400">已选定的模型、刀具、工序和参数</text><text x="651" y="450" font-size="16" fill="#193d46" font-weight="400">调用 FreeCAD 的加工算法</text><text x="651" y="474" font-size="16" fill="#617782" font-weight="400">计算切削路径及进退刀等移动</text><text x="1131" y="450" font-size="16" fill="#193d46" font-weight="600">D5：FreeCAD 内部刀路</text><text x="1131" y="474" font-size="16" fill="#617782" font-weight="400">移动、进给、转速等内部命令</text><path d="M257 430V486" stroke="#dce5e8" stroke-width="1"/><path d="M630 430V486" stroke="#dce5e8" stroke-width="1"/><path d="M1110 430V486" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="498" width="1560" height="76" rx="0" fill="#f0f5f7" stroke="none"/><rect x="20" y="498" width="4" height="76" rx="0" fill="#3977aa" stroke="none"/><text x="36" y="521" font-size="20" fill="#193d46" font-weight="600">06  设备后处理</text><text x="36" y="542" font-size="13" fill="#3977aa" font-weight="500">现成后处理程序 + 设备适配</text><text x="36" y="562" font-size="12" fill="#617782" font-weight="400">需按控制器验证</text><text x="278" y="528" font-size="16" fill="#193d46" font-weight="400">D5：内部刀路 + 目标控制器配置</text><text x="278" y="552" font-size="16" fill="#617782" font-weight="400">单位、工件坐标、刀补与换刀约定</text><text x="651" y="528" font-size="16" fill="#193d46" font-weight="400">按控制器方言转换和格式化命令</text><text x="651" y="552" font-size="16" fill="#617782" font-weight="400">生成程序起止、换刀等指令</text><text x="1131" y="528" font-size="16" fill="#193d46" font-weight="600">D6：最终 G-code 文件</text><text x="1131" y="552" font-size="16" fill="#617782" font-weight="400">附控制器、后处理器与配置版本</text><path d="M257 508V564" stroke="#dce5e8" stroke-width="1"/><path d="M630 508V564" stroke="#dce5e8" stroke-width="1"/><path d="M1110 508V564" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="576" width="1560" height="76" rx="0" fill="#fff" stroke="none"/><rect x="20" y="576" width="4" height="76" rx="0" fill="#087d79" stroke="none"/><text x="36" y="599" font-size="20" fill="#193d46" font-weight="600">07  仿真输入准备</text><text x="36" y="620" font-size="13" fill="#087d79" font-weight="500">我们写的适配程序</text><text x="36" y="640" font-size="12" fill="#617782" font-weight="400">有局部接口，需扩展</text><text x="278" y="606" font-size="16" fill="#193d46" font-weight="400">D6：最终 NC + 实际来料几何</text><text x="278" y="630" font-size="16" fill="#617782" font-weight="400">刀具、夹具、坐标、方言与精度</text><text x="651" y="606" font-size="16" fill="#193d46" font-weight="400">检查后端是否支持本次输入</text><text x="651" y="630" font-size="16" fill="#617782" font-weight="400">转换配置并组装完整仿真作业</text><text x="1131" y="606" font-size="16" fill="#193d46" font-weight="600">D7：仿真作业包</text><text x="1131" y="630" font-size="16" fill="#617782" font-weight="400">NC、来料、工具及后端执行配置</text><path d="M257 586V642" stroke="#dce5e8" stroke-width="1"/><path d="M630 586V642" stroke="#dce5e8" stroke-width="1"/><path d="M1110 586V642" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="654" width="1560" height="76" rx="0" fill="#f0f5f7" stroke="none"/><rect x="20" y="654" width="4" height="76" rx="0" fill="#3977aa" stroke="none"/><text x="36" y="677" font-size="20" fill="#193d46" font-weight="600">08  NC 去料仿真</text><text x="36" y="698" font-size="13" fill="#3977aa" font-weight="500">仿真引擎，如 CAMotics</text><text x="36" y="718" font-size="12" fill="#617782" font-weight="400">外部仅小控制验证</text><text x="278" y="684" font-size="16" fill="#193d46" font-weight="400">D7：仿真作业包</text><text x="278" y="708" font-size="16" fill="#617782" font-weight="400">本后端已支持的 NC、来料和刀具</text><text x="651" y="684" font-size="16" fill="#193d46" font-weight="400">解释最终 NC 并执行对应运动</text><text x="651" y="708" font-size="16" fill="#617782" font-weight="400">计算工具运动造成的材料去除</text><text x="1131" y="684" font-size="16" fill="#193d46" font-weight="600">D8：仿真结果包</text><text x="1131" y="708" font-size="16" fill="#617782" font-weight="400">剩余材料、执行记录、错误与精度</text><path d="M257 664V720" stroke="#dce5e8" stroke-width="1"/><path d="M630 664V720" stroke="#dce5e8" stroke-width="1"/><path d="M1110 664V720" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="732" width="1560" height="76" rx="0" fill="#fff" stroke="none"/><rect x="20" y="732" width="4" height="76" rx="0" fill="#087d79" stroke="none"/><text x="36" y="755" font-size="20" fill="#193d46" font-weight="600">09  几何验收</text><text x="36" y="776" font-size="13" fill="#087d79" font-weight="500">我们写的几何比较程序</text><text x="36" y="796" font-size="12" fill="#617782" font-weight="400">有基础，需按公差扩展</text><text x="278" y="762" font-size="16" fill="#193d46" font-weight="400">D8：剩余材料与执行记录</text><text x="278" y="786" font-size="16" fill="#617782" font-weight="400">B：只读原目标、基准和公差</text><text x="651" y="762" font-size="16" fill="#193d46" font-weight="400">先检查执行完整性与计算精度</text><text x="651" y="786" font-size="16" fill="#617782" font-weight="400">再检查过切、欠切、尺寸和位置</text><text x="1131" y="762" font-size="16" fill="#193d46" font-weight="600">D9：逐项几何验收报告</text><text x="1131" y="786" font-size="16" fill="#617782" font-weight="400">通过 / 不通过 / 不可判定及证据</text><path d="M257 742V798" stroke="#dce5e8" stroke-width="1"/><path d="M630 742V798" stroke="#dce5e8" stroke-width="1"/><path d="M1110 742V798" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="810" width="1560" height="76" rx="0" fill="#f0f5f7" stroke="none"/><rect x="20" y="810" width="4" height="76" rx="0" fill="#087d79" stroke="none"/><text x="36" y="833" font-size="20" fill="#193d46" font-weight="600">10  报告与回放</text><text x="36" y="854" font-size="13" fill="#087d79" font-weight="500">展示程序 + Anatomy</text><text x="36" y="874" font-size="12" fill="#617782" font-weight="400">已有基础，需接新结果</text><text x="278" y="840" font-size="16" fill="#193d46" font-weight="400">D8：材料状态 / 轨迹 + D9：验收</text><text x="278" y="864" font-size="16" fill="#617782" font-weight="400">工艺卡与本次运行记录</text><text x="651" y="840" font-size="16" fill="#193d46" font-weight="400">组织报告、差异位置和过程视图</text><text x="651" y="864" font-size="16" fill="#617782" font-weight="400">展示后端实际保存的状态</text><text x="1131" y="840" font-size="16" fill="#193d46" font-weight="600">D10：网页报告 / 动画</text><text x="1131" y="864" font-size="16" fill="#617782" font-weight="400">可查看、定位和追溯的运行结果</text><path d="M257 820V876" stroke="#dce5e8" stroke-width="1"/><path d="M630 820V876" stroke="#dce5e8" stroke-width="1"/><path d="M1110 820V876" stroke="#dce5e8" stroke-width="1"/><text x="30" y="918" font-size="20" fill="#193d46" font-weight="600">支撑模块 · 供上面各步骤调用</text><rect x="20" y="934" width="1560" height="68" rx="0" fill="#fff" stroke="none"/><rect x="20" y="934" width="4" height="68" rx="0" fill="#087d79" stroke="none"/><text x="36" y="957" font-size="20" fill="#193d46" font-weight="600">A  资源档案</text><text x="36" y="978" font-size="13" fill="#087d79" font-weight="500">配置 / 数据库 + 查询程序</text><text x="36" y="998" font-size="12" fill="#617782" font-weight="400">有参考配置，需统一</text><text x="278" y="964" font-size="16" fill="#193d46" font-weight="400">工厂设备、刀具、夹具及原料资料</text><text x="278" y="988" font-size="16" fill="#617782" font-weight="400">工艺规则与适用范围</text><text x="651" y="964" font-size="16" fill="#193d46" font-weight="400">保存版本、单位、能力和限制</text><text x="651" y="988" font-size="16" fill="#617782" font-weight="400">按 ID 查询并解析所需资源</text><text x="1131" y="964" font-size="16" fill="#193d46" font-weight="600">R：版本化的资源记录</text><text x="1131" y="988" font-size="16" fill="#617782" font-weight="400">供规划、校验、CAM 与仿真读取</text><path d="M257 944V992" stroke="#dce5e8" stroke-width="1"/><path d="M630 944V992" stroke="#dce5e8" stroke-width="1"/><path d="M1110 944V992" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="1004" width="1560" height="68" rx="0" fill="#f0f5f7" stroke="none"/><rect x="20" y="1004" width="4" height="68" rx="0" fill="#087d79" stroke="none"/><text x="36" y="1027" font-size="20" fill="#193d46" font-weight="600">B  原始验收基准</text><text x="36" y="1048" font-size="13" fill="#087d79" font-weight="500">只读存储与版本管理程序</text><text x="36" y="1068" font-size="12" fill="#617782" font-weight="400">有原目标保留，需扩展</text><text x="278" y="1034" font-size="16" fill="#193d46" font-weight="400">上游已校验的 D1 零件输入包</text><text x="278" y="1058" font-size="16" fill="#617782" font-weight="400">原始 CAD、基准与绑定要求</text><text x="651" y="1034" font-size="16" fill="#193d46" font-weight="400">固定模型版本、引用与哈希</text><text x="651" y="1058" font-size="16" fill="#617782" font-weight="400">让后续验收独立读取原始要求</text><text x="1131" y="1034" font-size="16" fill="#193d46" font-weight="600">B：不可由工艺 Agent 改写的快照</text><text x="1131" y="1058" font-size="16" fill="#617782" font-weight="400">目标几何 + 公差 / 基准 / 要求</text><path d="M257 1014V1062" stroke="#dce5e8" stroke-width="1"/><path d="M630 1014V1062" stroke="#dce5e8" stroke-width="1"/><path d="M1110 1014V1062" stroke="#dce5e8" stroke-width="1"/><rect x="20" y="1074" width="1560" height="68" rx="0" fill="#fff" stroke="none"/><rect x="20" y="1074" width="4" height="68" rx="0" fill="#087d79" stroke="none"/><text x="36" y="1097" font-size="20" fill="#193d46" font-weight="600">C  任务编排与回传</text><text x="36" y="1118" font-size="13" fill="#087d79" font-weight="500">我们写的流程控制程序</text><text x="36" y="1138" font-size="12" fill="#617782" font-weight="400">有限定路线，需通用化</text><text x="278" y="1104" font-size="16" fill="#193d46" font-weight="400">任务请求、各模块状态与错误</text><text x="278" y="1128" font-size="16" fill="#617782" font-weight="400">工艺卡、仿真和验收结果</text><text x="651" y="1104" font-size="16" fill="#193d46" font-weight="400">按依赖调用、传递结果、记录版本</text><text x="651" y="1128" font-size="16" fill="#617782" font-weight="400">遇错停止；按错误类型反馈重试</text><text x="1131" y="1104" font-size="16" fill="#193d46" font-weight="600">运行记录 / 停止原因 / 修改请求</text><text x="1131" y="1128" font-size="16" fill="#617782" font-weight="400">可修正的工艺问题返回 Agent</text><path d="M257 1084V1132" stroke="#dce5e8" stroke-width="1"/><path d="M630 1084V1132" stroke="#dce5e8" stroke-width="1"/><path d="M1110 1084V1132" stroke="#dce5e8" stroke-width="1"/><text x="28" y="1180" font-size="15" fill="#617782" font-weight="400">D1 → D10 是阶段结果；R 是资源档案，B 是只读验收基准。失败由编排程序回传。</text><text x="1290" y="1180" font-size="15" fill="#617782" font-weight="400">接口设计稿 · 尚未整链贯通</text></g></svg>