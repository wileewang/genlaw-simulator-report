<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">制造系统第一层：工艺规划、加工编程、仿真检验</title><desc id="desc">只展示三个核心模块的输入、输出和实现方式。CAD 与制造要求输入工艺规划，工艺卡进入加工编程，G-code 与实际毛坯进入仿真检验，输出几何报告与回放；检验失败回传工艺规划。原始要求及设备等资源贯穿全程。</desc><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei','Droid Sans Fallback',sans-serif"><rect x="0" y="0" width="1440" height="790" rx="0" fill="#f7fafb" stroke="none"/><text x="44" y="58" font-size="32" fill="#193d46" font-weight="700">第一层：三个核心模块</text><text x="44" y="94" font-size="18" fill="#617782" font-weight="400">工艺规划 → 加工编程 → 仿真检验</text><rect x="44" y="124" width="1352" height="64" rx="12" fill="#eaf0f3" stroke="none"/><text x="66" y="163" font-size="20" fill="#193d46" font-weight="500">上游输入：零件 CAD + 已关联的制造要求</text><rect x="44" y="222" width="428" height="350" rx="14" fill="#fff" stroke="#dce5e8"/><rect x="64" y="242" width="35" height="30" rx="6" fill="#7756a7" stroke="none"/><text x="70" y="263" font-size="17" fill="#fff" font-weight="600">01</text><text x="114" y="266" font-size="25" fill="#193d46" font-weight="700">工艺规划</text><text x="66" y="303" font-size="17" fill="#617782" font-weight="400">决定怎么加工</text><text x="66" y="344" font-size="13" fill="#617782" font-weight="600">输入</text><text x="66" y="372" font-size="18" fill="#193d46" font-weight="400">CAD + 制造要求 + 可用资源</text><text x="66" y="431" font-size="13" fill="#617782" font-weight="600">输出</text><text x="66" y="462" font-size="22" fill="#7756a7" font-weight="600">工艺卡</text><path d="M66 491H450" stroke="#dce5e8"/><text x="66" y="524" font-size="13" fill="#617782" font-weight="600">实现方式</text><text x="66" y="551" font-size="17" fill="#193d46" font-weight="400">先定义接口；Agent 实现后置</text><path d="M480 258h17m-6-6 6 6-6 6" fill="none" stroke="#8298a1" stroke-width="2"/><rect x="506" y="222" width="428" height="350" rx="14" fill="#fff" stroke="#dce5e8"/><rect x="526" y="242" width="35" height="30" rx="6" fill="#3977aa" stroke="none"/><text x="532" y="263" font-size="17" fill="#fff" font-weight="600">02</text><text x="576" y="266" font-size="25" fill="#193d46" font-weight="700">加工编程</text><text x="528" y="303" font-size="17" fill="#617782" font-weight="400">把工艺变成设备指令</text><text x="528" y="344" font-size="13" fill="#617782" font-weight="600">输入</text><text x="528" y="372" font-size="18" fill="#193d46" font-weight="400">工艺卡 + CAD</text><text x="528" y="431" font-size="13" fill="#617782" font-weight="600">输出</text><text x="528" y="462" font-size="22" fill="#3977aa" font-weight="600">G-code + 加工配置</text><path d="M528 491H912" stroke="#dce5e8"/><text x="528" y="524" font-size="13" fill="#617782" font-weight="600">实现方式</text><text x="528" y="551" font-size="17" fill="#193d46" font-weight="400">起步：FreeCAD CAM + 后处理</text><path d="M942 258h17m-6-6 6 6-6 6" fill="none" stroke="#8298a1" stroke-width="2"/><rect x="968" y="222" width="428" height="350" rx="14" fill="#fff" stroke="#dce5e8"/><rect x="988" y="242" width="35" height="30" rx="6" fill="#087d79" stroke="none"/><text x="994" y="263" font-size="17" fill="#fff" font-weight="600">03</text><text x="1038" y="266" font-size="25" fill="#193d46" font-weight="700">仿真检验</text><text x="990" y="303" font-size="17" fill="#617782" font-weight="400">检查加工后的几何是否合格</text><text x="990" y="344" font-size="13" fill="#617782" font-weight="600">输入</text><text x="990" y="372" font-size="18" fill="#193d46" font-weight="400">G-code + 加工配置 + 实际毛坯</text><text x="990" y="396" font-size="14" fill="#617782" font-weight="400">对照原始 CAD 与制造要求</text><text x="990" y="431" font-size="13" fill="#617782" font-weight="600">输出</text><text x="990" y="462" font-size="22" fill="#087d79" font-weight="600">几何检验报告 + 回放</text><path d="M990 491H1374" stroke="#dce5e8"/><text x="990" y="524" font-size="13" fill="#617782" font-weight="600">实现方式</text><text x="990" y="551" font-size="17" fill="#193d46" font-weight="400">起步：CAMotics + 几何验收</text><text x="44" y="616" font-size="18" fill="#617782" font-weight="400">共同资料：原料、设备、刀具、夹具资料；原始 CAD 与制造要求贯穿全程。</text><path d="M1200 647v22H256v-22m-6 6 6-6 6 6" fill="none" stroke="#8298a1" stroke-width="1.5"/><rect x="525" y="651" width="405" height="34" rx="0" fill="#f7fafb" stroke="none"/><text x="547" y="675" font-size="17" fill="#617782" font-weight="400">检验失败 → 把原因返回工艺规划</text><text x="44" y="748" font-size="17" fill="#617782" font-weight="400">网页中点开某个模块，再看它的第二层。</text><text x="1153" y="748" font-size="16" fill="#617782" font-weight="400">系统设计 · 整链待接通</text></g></svg>