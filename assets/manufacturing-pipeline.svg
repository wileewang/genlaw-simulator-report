<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1184" viewBox="0 0 1680 1184" role="img" aria-labelledby="title description">
<title id="title">从零件 CAD 到几何验收：Agent 与程序如何协作</title>
<desc id="description">拟定架构，尚未完成整链集成。四个主环节：上游模型绑定几何与要求；工艺 Agent 生成 JSON 工艺卡，由程序校验；适配器转换为 CAM Job，FreeCAD CAM 与后处理生成最终 G-code；独立 NC 仿真生成剩余材料，由程序对照不可改写的原始 CAD 和要求验收。资源库提供毛坯、设备、刀具、夹具及工艺规则。失败证据回传工艺 Agent。粗糙度仅用于工艺规划，目前不作几何仿真通过结论。</desc>
