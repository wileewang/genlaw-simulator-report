<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 225" role="img" aria-labelledby="title desc"><title id="title">S1 名义尺寸图</title><desc id="desc">8×6×1.5 毫米薄板，孔心 X3 Y2，直径 2 毫米通孔。尺寸来自已存档 CAD 参数，公差待审。</desc><rect width="510" height="225" fill="white"/><text x="55" y="17" font-size="10" font-family="sans-serif" fill="#183750">俯视：从 +Z 看向顶面</text><text x="320" y="17" font-size="10" font-family="sans-serif" fill="#183750">正视：从 −Y 看向零件</text><rect x="55" y="60.0" width="160.0" height="120.0" fill="none" stroke="#183750"/><circle cx="115.0" cy="140.0" r="20.0" fill="none" stroke="#183750"/><line x1="95.0" y1="140.0" x2="135.0" y2="140.0" stroke="#183750" stroke-width=".6" stroke-dasharray="3 2"/><line x1="115.0" y1="160.0" x2="115.0" y2="120.0" stroke="#183750" stroke-width=".6" stroke-dasharray="3 2"/><line x1="55" y1="48.0" x2="215.0" y2="48.0" stroke="#183750" stroke-width=".6"/><text x="125.0" y="36.0" font-size="9" font-family="sans-serif" fill="#183750">8 mm</text><line x1="39" y1="180" x2="39" y2="60.0" stroke="#183750" stroke-width=".6"/><text x="7" y="114.0" font-size="9" font-family="sans-serif" fill="#183750">6 mm</text><line x1="55" y1="194" x2="115.0" y2="194" stroke="#183750" stroke-width=".6"/><text x="79.0" y="203" font-size="9" font-family="sans-serif" fill="#183750">3</text><line x1="230.0" y1="180" x2="230.0" y2="140.0" stroke="#183750" stroke-width=".6"/><text x="236.0" y="154.0" font-size="9" font-family="sans-serif" fill="#183750">2</text><line x1="129.0" y1="126.0" x2="170" y2="93" stroke="#183750" stroke-width=".6"/><text x="173" y="84" font-size="10" font-family="sans-serif" fill="#183750">φ2 通孔</text><text x="49" y="179" font-size="9" font-family="sans-serif" fill="#183750">O</text><text x="221.0" y="178" font-size="9" font-family="sans-serif" fill="#183750">X</text><text x="51" y="50.0" font-size="9" font-family="sans-serif" fill="#183750">Y</text><rect x="320" y="105.0" width="160.0" height="30.0" fill="none" stroke="#183750"/><line x1="360.0" y1="135" x2="360.0" y2="105.0" stroke="#183750" stroke-width=".6" stroke-dasharray="3 2"/><line x1="400.0" y1="135" x2="400.0" y2="105.0" stroke="#183750" stroke-width=".6" stroke-dasharray="3 2"/><text x="320" y="85.0" font-size="9" font-family="sans-serif" fill="#183750">顶面 Z=0</text><text x="320" y="147" font-size="9" font-family="sans-serif" fill="#183750">底面 Z=-1.5 mm</text><line x1="490.0" y1="135" x2="490.0" y2="105.0" stroke="#183750" stroke-width=".6"/><text x="408" y="164" font-size="10" font-family="sans-serif" fill="#183750">厚度 1.5 mm</text><text x="55" y="219" font-size="9" font-family="sans-serif" fill="#183750">单位 mm；名义尺寸示意，打印比例不用于测量；公差与制造基准待审。</text><line x1="53" y1="51.0" x2="57" y2="45.0" stroke="#183750" stroke-width=".6"/><line x1="213.0" y1="51.0" x2="217.0" y2="45.0" stroke="#183750" stroke-width=".6"/><line x1="37" y1="183" x2="41" y2="177" stroke="#183750" stroke-width=".6"/><line x1="37" y1="63.0" x2="41" y2="57.0" stroke="#183750" stroke-width=".6"/><line x1="53" y1="197" x2="57" y2="191" stroke="#183750" stroke-width=".6"/><line x1="113.0" y1="197" x2="117.0" y2="191" stroke="#183750" stroke-width=".6"/><line x1="228.0" y1="183" x2="232.0" y2="177" stroke="#183750" stroke-width=".6"/><line x1="228.0" y1="143.0" x2="232.0" y2="137.0" stroke="#183750" stroke-width=".6"/><line x1="488.0" y1="138" x2="492.0" y2="132" stroke="#183750" stroke-width=".6"/><line x1="488.0" y1="108.0" x2="492.0" y2="102.0" stroke="#183750" stroke-width=".6"/></svg>