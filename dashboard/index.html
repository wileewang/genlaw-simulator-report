<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heimdall 运行看板</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --worker1:#86b6ef; --worker2:#2a78d6; --worker3:#104281; --review:#eb6834; --developer:#1baf7a;
  --human:#eda100; --system:#e87ba4; --blocked:#6250d6; --none:#d5d4cd; --off:transparent;
  --bar:#2a78d6; --good:#0ca30c; --critical:#d03b3b; --warnbg:#fff4d6; --chip:#f0efec;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --worker1:#184f95; --worker2:#3987e5; --worker3:#9ec5f4; --review:#d95926; --developer:#199e70;
    --human:#c98500; --system:#d55181; --blocked:#9085e9; --none:#383835;
    --bar:#3987e5; --warnbg:#3a2f10; --chip:#2c2c2a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:650}
h2{font-size:15px;margin:0 0 4px;font-weight:650}
.sub{color:var(--ink2);font-size:13px;margin:0 0 12px}
.fresh{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.stale .dot{background:var(--critical)}
.stale{color:var(--critical);font-weight:600}
section{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:16px 18px;margin:12px 0}
.now{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px}
.now b{font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--ring);border-radius:8px;padding:10px 12px;background:var(--surface)}
.tile .k{font-size:12.5px;color:var(--ink2)}
.tile .v{font-size:26px;font-weight:650;line-height:1.25}
.tile .v small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px}
.tile .n{font-size:12px;color:var(--muted)}
.grp{font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.grp:first-child{margin-top:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:550;font-size:12.5px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:9px;background:var(--chip);color:var(--ink2);margin-left:4px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:0 0 10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.day{padding:12px 0;border-top:1px solid var(--grid)}
.day:first-of-type{border-top:0}
.dayhead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:6px}
.dayhead b{font-size:14px}
.dayhead span{font-size:12.5px;color:var(--ink2)}
.lane{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;height:18px}
.lane .name{font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.track{position:relative;height:12px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--grid) calc(12.5% - 1px),var(--grid) 12.5%)}
.seg{position:absolute;top:0;height:100%;min-width:2px;border-radius:2px}
.seg:hover{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.offrange{position:absolute;top:0;height:100%;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--grid) 4px 5px)}
.hours{display:grid;grid-template-columns:52px 1fr;gap:8px;margin-top:2px}
.hours div{position:relative;height:16px;font-size:11px;color:var(--muted)}
.hours span{position:absolute;transform:translateX(-50%)}
.hours span:first-child{transform:none}.hours span:last-child{transform:translateX(-100%)}
.bars{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 12px;align-items:center;margin:6px 0 14px}
.bars .lab{font-size:13px;cursor:pointer}
.bars .lab small{display:block;color:var(--muted);font-size:11.5px;max-width:340px}
.bars .bw{display:flex;align-items:center;gap:8px;cursor:pointer}
.bars .b{height:18px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bars .sel .b,.bars .bw.sel .b{outline:2px solid var(--ink);outline-offset:1px}
.bars .val{font-variant-numeric:tabular-nums;font-size:13px}
.pill{display:inline-block;border:1px solid var(--ring);border-radius:12px;padding:1px 10px;font-size:12.5px;cursor:pointer;background:var(--surface);color:var(--ink2)}
.pill.on{background:var(--ink);color:var(--surface)}
.note{background:var(--warnbg);border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--ink2);margin:8px 0 0}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 8px;border-radius:5px;max-width:320px;z-index:10;display:none;line-height:1.45}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
@media (max-width:640px){.tile .v{font-size:22px}.lane,.hours{grid-template-columns:40px 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">Heimdall 运行看板</h1><span class="sub" id="range" style="margin:0"></span><span class="fresh" id="fresh"><span class="dot"></span><span>正在读数据…</span></span></header>
  <div id="app"></div>
</div>
<div id="tip"></div>
<script>
'use strict';
var D = null, ui = {kind: null, days: 7}, loadedAt = 0;
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); };
var hm = function (iso) { return iso ? iso.slice(11, 16) : ''; };
var dhm = function (iso) { return iso ? iso.slice(5, 10) + ' ' + iso.slice(11, 16) : ''; };
var mm = function (m) { var h = Math.floor(m / 60), r = m % 60; return (h < 10 ? '0' : '') + h + ':' + (r < 10 ? '0' : '') + r; };
var dur = function (m) { m = Math.round(m); return m < 60 ? m + ' 分钟' : Math.floor(m / 60) + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : ''); };
var hrs = function (m) { return (m / 60).toFixed(1); };
var pct = function (x) { return x == null ? '–' : Math.round(x * 100) + '%'; };
var num = function (x) { return x == null ? '–' : x; };
var IDLE_COLOR = {human: 'var(--human)', blocked: 'var(--blocked)', queue: 'var(--system)', flow: 'var(--system)', dev: 'var(--system)', none: 'var(--none)'};

function tile(k, v, unit, n) { return '<div class="tile"><div class="k">' + E(k) + '</div><div class="v">' + E(v) + (unit ? '<small>' + E(unit) + '</small>' : '') + '</div><div class="n">' + (n || '&nbsp;') + '</div></div>'; }

function seg(a, b, color, tip) { return '<div class="seg" style="left:' + (a / 14.4).toFixed(3) + '%;width:' + ((b - a) / 14.4).toFixed(3) + '%;background:' + color + '" data-tip="' + E(tip) + '"></div>'; }

function lane(name, html, day) {
  var off = '';
  if (day.from > 0) off += '<div class="offrange" style="left:0;width:' + (day.from / 14.4).toFixed(3) + '%" data-tip="这段时间 Heimdall 还没开始运行"></div>';
  if (day.to < 1440) off += '<div class="offrange" style="left:' + (day.to / 14.4).toFixed(3) + '%;width:' + ((1440 - day.to) / 14.4).toFixed(3) + '%" data-tip="还没到"></div>';
  return '<div class="lane"><div class="name">' + name + '</div><div class="track">' + off + html + '</div></div>';
}

function dayBlock(x) {
  var m = x.minutes, c = x.counts, L = x.lanes, z = D.idle_zh;
  var w = L.worker.map(function (s) { return seg(s[0], s[1], s[2] >= 3 ? 'var(--worker3)' : s[2] === 2 ? 'var(--worker2)' : 'var(--worker1)', '执行者 ' + s[2] + ' 个在跑 · ' + mm(s[0]) + '–' + mm(s[1]) + '（' + dur(s[1] - s[0]) + '）'); }).join('');
  var r = L.review.map(function (s) { return seg(s[0], s[1], 'var(--review)', '评审 · ' + mm(s[0]) + '–' + mm(s[1]) + '（' + dur(s[1] - s[0]) + '）'); }).join('');
  var d = L.developer.map(function (s) { return seg(s[0], s[1], 'var(--developer)', '开发会话 · ' + mm(s[0]) + '–' + mm(s[1]) + '（' + dur(s[1] - s[0]) + '）'); }).join('')
        + (L.reporter || []).map(function (s) { return seg(s[0], s[1], 'var(--developer)', '报告会话 · ' + mm(s[0]) + '–' + mm(s[1]) + '（' + dur(s[1] - s[0]) + '）'); }).join('');
  var h = L.human.map(function (s) { return seg(s[0], s[1], 'var(--human)', '有卡片在等用户答 · ' + mm(s[0]) + '–' + mm(s[1]) + '（' + dur(s[1] - s[0]) + '）'); }).join('');
  var i = x.idle.map(function (s) { return seg(s[0], s[1], IDLE_COLOR[s[2]], '空档 · ' + z[s[2]] + ' · ' + mm(s[0]) + '–' + mm(s[1]) + '（' + dur(s[1] - s[0]) + '）'); }).join('');
  var why = Object.keys(m.idle_by).filter(function (k) { return m.idle_by[k] >= 1; }).map(function (k) { return z[k] + ' ' + hrs(m.idle_by[k]); }).join('、');
  var ticks = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(function (t) { return '<span style="left:' + (t / 24 * 100) + '%">' + t + '</span>'; }).join('');
  return '<div class="day"><div class="dayhead"><b>' + x.date + '</b>'
    + '<span>有 Agent 在跑 ' + hrs(m.active) + ' / ' + hrs(x.covered) + ' 小时（' + pct(x.covered ? m.active / x.covered : null) + '）</span>'
    + '<span>空档 ' + hrs(m.idle) + ' 小时' + (why ? '：' + E(why) + '（小时）' : '') + '</span>'
    + '<span>执行者并行最多 ' + x.peak + '</span></div>'
    + lane('执行者', w, x) + lane('评审', r, x) + lane('开发', d, x) + lane('等用户', h, x) + lane('空档', i, x)
    + '<div class="hours"><div></div><div>' + ticks + '</div></div></div>';
}

function render() {
  if (!D) return;
  var t = D.total, e = D.eff, w = D.window, L = D.live, o = [];
  document.getElementById('title').textContent = 'Heimdall 运行看板 · ' + D.project;
  document.title = 'Heimdall 运行看板 · ' + D.project;
  document.getElementById('range').textContent = '从 ' + dhm(D.first_event) + ' 开始运行';

  // 现在
  var now = [];
  now.push('<span><b>执行者</b> ' + (L.workers.length ? L.workers.map(function (x) { return '<span data-tip="' + E(x.title) + '">' + E(x.task) + '（已 ' + dur(x.minutes) + '）</span>'; }).join('、') : '没有在跑的') + '</span>');
  if (L.reviews.length) now.push('<span><b>评审中</b> ' + L.reviews.map(function (x) { return E(x.report); }).join('、') + '</span>');
  now.push('<span><b>排队</b> ' + (L.queue.length ? L.queue.map(function (x) { return '<span data-tip="' + E(x.title + (x.why ? '｜' + x.why : '')) + '">' + E(x.task) + '（等了 ' + dur(x.minutes) + '）</span>'; }).join('、') : '没有') + '</span>');
  now.push('<span><b>等你答的卡片</b> ' + (L.cards.length ? L.cards.map(function (x) { return '<span data-tip="' + E(x.title) + '">' + E(x.id) + '（' + dur(x.minutes) + '）</span>'; }).join('、') : '没有') + '</span>');
  o.push('<section><h2>现在</h2><div class="now">' + now.join('') + '</div></section>');

  // 量和效率
  var agents = t.agents.map(function (a) { return E(a.name) + ' ' + a.n; }).join(' · ');
  o.push('<section><div class="grp">量（从开始运行到现在）</div><div class="tiles">'
    + tile('开发发出的任务', t.tasks_by_developer, '张', '做完 ' + t.passed_tasks + ' · 取消 ' + t.cancelled + ' · 拆开 ' + t.split + ' · 没做完 ' + t.open_tasks)
    + tile('启动执行者', t.dispatched, '次', agents)
    + tile('交回', t.reports, '次', '环境问题上报 ' + t.env_problems + ' 次')
    + tile('评审', t.reviews, '次', '通过 ' + t.passes + ' · 退回 ' + t.returns)
    + tile('退回', t.returns, '次', '占评审的 ' + pct(e.return_rate))
    + tile('失败', t.fails, '起', '验收没过 ' + t.judge_failed + ' · 受阻 ' + t.blocked_reports + ' · 取消 ' + t.cancelled)
    + '</div><div class="grp">效率</div><div class="tiles">'
    + tile('第一次评审就通过', pct(e.first_pass_rate), '', e.first_pass + ' / ' + e.reviewed_tasks + ' 张任务')
    + tile('做完一张任务平均交回', num(e.reports_per_passed), '次', '1 次是一遍过')
    + tile('执行一轮（中位）', num(e.round_minutes), '分钟', '派出或退回到交回')
    + tile('评审一次（中位）', num(e.review_minutes), '分钟', '请评审到出结论')
    + tile('派出到做完（中位）', num(e.task_minutes), '分钟', '含返工和评审')
    + tile('你答卡片（中位）', num(e.card_minutes), '分钟', '发出到答复')
    + tile('有 Agent 在跑', pct(w.covered ? w.active / w.covered : null), '', hrs(w.active) + ' / ' + hrs(w.covered) + ' 小时（最近 ' + w.days + ' 天）')
    + '</div></section>');

  // 每天的量
  var rows = D.days.slice().reverse().map(function (x) {
    var c = x.counts, m = x.minutes;
    return '<tr><td class="nw">' + x.date + '</td><td class="num">' + c.created + '</td><td class="num">' + c.dispatched + '</td><td class="num">' + c.reports + '</td><td class="num">' + c.reviews
      + '</td><td class="num">' + c.returns + '</td><td class="num">' + c.passes + '</td><td class="num">' + (c.judge_failed + c.blocked + c.cancelled) + '</td><td class="num">' + hrs(m.active) + '</td><td class="num">' + hrs(m.idle)
      + '</td><td class="num">' + pct(x.covered ? m.active / x.covered : null) + '</td><td class="num">' + x.peak + '</td></tr>';
  }).join('');
  o.push('<section><h2>每天的量</h2><div class="scroll"><table><thead><tr><th>日期</th><th class="num">新任务</th><th class="num">启动执行者</th><th class="num">交回</th><th class="num">评审</th><th class="num">退回</th><th class="num">评审通过</th><th class="num">失败</th><th class="num">在跑（小时）</th><th class="num">空档（小时）</th><th class="num">在跑占比</th><th class="num">并行最多</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>');

  // 24 小时
  var days = D.days.slice().reverse().slice(0, ui.days);
  o.push('<section><h2>每天 24 小时：什么时候有 Agent 在跑</h2><p class="sub">横轴是一天的 0 到 24 点。空档指执行者、评审、开发都没有在跑的时间，颜色表示那时在等什么。鼠标放上去看起止时间。</p>'
    + '<div class="legend"><span><i class="sw" style="background:var(--worker1)"></i>执行者 1 个</span><span><i class="sw" style="background:var(--worker2)"></i>2 个并行</span><span><i class="sw" style="background:var(--worker3)"></i>3 个以上</span>'
    + '<span><i class="sw" style="background:var(--review)"></i>评审</span><span><i class="sw" style="background:var(--developer)"></i>开发或报告会话</span>'
    + '<span><i class="sw" style="background:var(--human)"></i>等用户答卡片</span><span><i class="sw" style="background:var(--blocked)"></i>空档：执行者报了受阻，等人处理</span>'
    + '<span><i class="sw" style="background:var(--system)"></i>空档：等调度派工、等验收评审、等开发排下一批</span><span><i class="sw" style="background:var(--none)"></i>空档：没有排着的任务</span></div>'
    + days.map(dayBlock).join('')
    + (D.days.length > ui.days ? '<p><span class="pill" data-act="moredays">再看更早的 ' + (D.days.length - ui.days) + ' 天</span></p>' : '') + '</section>');

  // 空档明细
  var gaps = D.gaps.slice().reverse().map(function (x) {
    var by = Object.keys(x.by).map(function (k) { return D.idle_zh[k] + ' ' + dur(x.by[k]); }).join('；');
    return '<tr><td class="nw">' + dhm(x.from) + '</td><td class="nw">' + (x.open ? '还在继续' : dhm(x.to)) + '</td><td class="num">' + dur(x.minutes) + '</td><td>' + E(by) + '</td><td>' + E(x.cards.join('、')) + '</td></tr>';
  }).join('');
  o.push('<section><h2>空档明细</h2><p class="sub">连续 10 分钟以上没有任何执行者、评审、开发在跑的时间段，最近的在上面。最近 ' + w.days + ' 天空档共 ' + hrs(w.idle) + ' 小时。</p>'
    + (gaps ? '<div class="scroll"><table><thead><tr><th>从</th><th>到</th><th class="num">多长</th><th>那时在等什么</th><th>当时等着答的卡片</th></tr></thead><tbody>' + gaps + '</tbody></table></div>' : '<div class="empty">没有 10 分钟以上的空档。</div>') + '</section>');

  // 退回原因
  var kmax = Math.max.apply(null, D.return_kinds.map(function (k) { return k.n; }).concat([1]));
  var bars = D.return_kinds.map(function (k) {
    var on = ui.kind === k.kind ? ' sel' : '';
    return '<div class="lab" data-act="kind" data-kind="' + E(k.kind) + '">' + E(k.kind) + (k.what ? '<small>' + E(k.what) + '</small>' : '') + '</div>'
      + '<div class="bw' + on + '" data-act="kind" data-kind="' + E(k.kind) + '"><div class="b" style="width:' + (k.n / kmax * 78).toFixed(1) + '%"></div><span class="val">' + k.n + ' 次</span></div>';
  }).join('');
  var rets = D.returns.filter(function (x) { return !ui.kind || x.kind === ui.kind; }).slice().reverse();
  var tagged = D.returns.filter(function (x) { return x.src === 'tagged'; }).length, untyped = D.returns.filter(function (x) { return x.kind === '没写类别'; }).length;
  var rrows = rets.map(function (x) {
    return '<tr><td class="nw">' + dhm(x.at) + '</td><td class="nw"><span data-tip="' + E(x.title) + '">' + E(x.task) + '</span></td><td class="num">' + (x.round ? '第 ' + x.round + ' 次' : '') + '</td><td class="nw">' + E(x.kind)
      + (x.src === 'tagged' ? '<span class="tag" data-tip="评审单当时没有这一栏，事后读评审意见补的">补标</span>' : '') + '</td><td>' + E(x.why) + '</td><td class="nw">' + E(x.id || x.report) + '</td></tr>';
  }).join('');
  o.push('<section><h2>退回原因</h2><p class="sub">一共退回 ' + D.returns.length + ' 次。点一个类别只看这一类；再点一次看全部。</p>'
    + (D.returns.length ? '<div class="bars">' + bars + '</div>' : '')
    + (rrows ? '<div class="scroll"><table><thead><tr><th>时间</th><th>任务</th><th class="num">这张任务</th><th>类别</th><th>最主要的原因</th><th>评审单</th></tr></thead><tbody>' + rrows + '</tbody></table></div>' : '<div class="empty">还没有退回。</div>')
    + (tagged || untyped ? '<div class="note">' + (tagged ? tagged + ' 次的类别是事后补标的（当时的评审单没有“退回类别”一栏）。' : '') + (untyped ? untyped + ' 次没有类别。' : '') + '之后的评审单由评审自己写类别和一句话原因。</div>' : '') + '</section>');

  // 退回最多的任务
  var trows = D.return_tasks.map(function (x) {
    return '<tr><td class="nw">' + E(x.id) + (x.from ? '<span class="tag">接 ' + E(x.from) + '</span>' : '') + '</td><td>' + E(x.title) + '</td><td class="num">' + x.returns + '</td><td class="num">' + x.reports + '</td><td class="nw">' + E(x.state) + '</td></tr>';
  }).join('');
  o.push('<section><h2>被退回过的任务</h2>' + (trows ? '<div class="scroll"><table><thead><tr><th>任务</th><th>做什么</th><th class="num">退回</th><th class="num">交回</th><th>现在</th></tr></thead><tbody>' + trows + '</tbody></table></div>' : '<div class="empty">没有。</div>') + '</section>');

  // 失败
  var frows = D.fails.slice().reverse().map(function (x) { return '<tr><td class="nw">' + dhm(x.at) + '</td><td class="nw">' + E(x.kind) + '</td><td class="nw">' + E(x.id) + '</td><td>' + E(x.note) + '</td></tr>'; }).join('');
  o.push('<section><h2>失败明细</h2><p class="sub">没做成的事：自动验收没过、执行者报受阻或只完成一部分、任务被取消、合并或验收出错。评审退回不算在这里。</p>'
    + (frows ? '<div class="scroll"><table><thead><tr><th>时间</th><th>哪一种</th><th>单号</th><th>说明</th></tr></thead><tbody>' + frows + '</tbody></table></div>' : '<div class="empty">没有。</div>') + '</section>');

  document.getElementById('app').innerHTML = o.join('');
}

function fresh() {
  var el = document.getElementById('fresh');
  if (!D) return;
  var age = Math.max(0, Math.round((Date.now() - new Date(D.generated).getTime()) / 1000));
  var every = D.refresh == null ? 60 : D.refresh, snap = every === 0, stale = !snap && age > every * 2.5 + 120;
  el.className = 'fresh' + (stale ? ' stale' : '');
  el.lastChild.textContent = '数据时间 ' + D.generated.slice(5, 10) + ' ' + D.generated.slice(11, 19) + (snap ? '，这是一份快照，不会自己更新'
    : stale ? '，已经 ' + dur(age / 60) + '没有更新（Heimdall 的常驻服务可能停了）'
    : '，' + (age < 60 ? age + ' 秒前' : Math.round(age / 60) + ' 分钟前') + '，' + (every >= 120 ? '每 ' + Math.round(every / 60) + ' 分钟更新一次' : '自动更新'));
}

function load() {
  var s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();
  s.onload = function () { s.remove(); if (window.HD_STATS && (!D || window.HD_STATS.generated !== D.generated)) { D = window.HD_STATS; render(); } fresh(); };
  s.onerror = function () { s.remove(); fresh(); };
  document.head.appendChild(s);
}

document.addEventListener('click', function (ev) {
  var a = ev.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'kind') ui.kind = ui.kind === a.dataset.kind ? null : a.dataset.kind;
  if (a.dataset.act === 'moredays') ui.days = 999;
  render();
});
var tip = document.getElementById('tip');
document.addEventListener('mousemove', function (ev) {
  var a = ev.target.closest && ev.target.closest('[data-tip]');
  if (!a) { tip.style.display = 'none'; return; }
  tip.textContent = a.dataset.tip;
  tip.style.display = 'block';
  var x = Math.min(ev.clientX + 12, window.innerWidth - tip.offsetWidth - 8), y = ev.clientY + 16;
  if (y + tip.offsetHeight > window.innerHeight - 8) y = ev.clientY - tip.offsetHeight - 10;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px';
});
var SNAP = !!window.HD_STATS;                                      /* 单文件快照：数据直接写在页面里 */
if (SNAP) { D = window.HD_STATS; render(); fresh(); } else load();
setInterval(function () { if (!SNAP) load(); }, 30000);
setInterval(fresh, 1000);
</script>
</body>
</html>
